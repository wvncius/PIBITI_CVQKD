
name: Compilar documentos LaTeX

on:
  push:
    paths:
      - "docs/**/*.tex"
      - ".github/workflows/compilar-latex.yml"
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar LaTeX
        run: |
            sudo apt-get update
            sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-lang-portuguese \
            texlive-publishers \
            latexmk

      - name: Compilar todos os documentos
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p pdfs
          contador=0

          while IFS= read -r -d '' arquivo; do
            # Compila apenas documentos independentes
            if ! grep -Eq '^[[:space:]]*\\documentclass' "$arquivo"; then
              continue
            fi

            echo "Compilando: $arquivo"

            diretorio="$(dirname "$arquivo")"
            nome="$(basename "$arquivo" .tex)"

            latexmk -pdf -interaction=nonstopmode \
              -halt-on-error \
              -cd "$arquivo"

            destino="pdfs/${arquivo#docs/}"
            destino="${destino%.tex}.pdf"

            mkdir -p "$(dirname "$destino")"
            cp "$diretorio/$nome.pdf" "$destino"

            contador=$((contador + 1))
          done < <(find docs -type f -name '*.tex' -print0)

          if [ "$contador" -eq 0 ]; then
            echo "Nenhum documento LaTeX independente encontrado."
            exit 1
          fi

          echo "$contador documento(s) compilado(s)."

      - name: Disponibilizar PDFs
        uses: actions/upload-artifact@v4
        with:
          name: documentos-pibiti
          path: pdfs/
          if-no-files-found: error
          retention-days: 30
